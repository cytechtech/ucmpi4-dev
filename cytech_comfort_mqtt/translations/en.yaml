---
configuration:
  comfort_serial_mode:
    name: Comfort baud rate
    description: >
      Select the serial baud rate for the Comfort connection.
      Use 115200 for UCMA/Pi or CM4Pi on CM9001.
      Use 9600 for CM4Pi on UCMA/General.
  mqtt_security:
    name: MQTT security
    description: >-
      Choose how the add-on connects to MQTT. Password uses a username and
      password without encryption. TLS adds encryption. Mutual TLS adds
      encryption and also identifies the add-on with a certificate.
      Certificates are created automatically.    
  comfort_login_id:
    name: Comfort User Login ID
    description: >-
      Cytech Comfort User Login ID with at least Read-Only access. Login ID has minimum 4 characters and 6 as maximum.
      For full functionality you need Read/Write access as well as Disarm capabilities.
  comfort_battery_update:
    name: Comfort MQTT Bridge Battery Update target ID.
    description: >-
      The ID to query when the Comfort MQTT Bridge 'Battery Update' control is pressed. Range consisting of [0,1,33,34,35,36,37,38,39] (Default is 1).    
  log_verbosity:
    name: Global Log Verbosity
    description: >-
      Global Log Verbosity level (Default INFO).
  alarm_inputs:
    name: Comfort Zone Inputs (In multiples of 8).
    description: >-
      Cytech Comfort Zone Inputs installed on your system. Range from 8 - 96 (Default is 8).
  alarm_outputs:
    name: Comfort Zone Outputs (In multiples of 8).
    description: >-
      Cytech Comfort Zone Outputs installed on your system. Range from 0 - 96 (Default is 0).
  flag_count:
    name: Comfort Flags
    description: >-
      The number of Cytech Comfort Flags that are shown in Home Assistant and can range from 0 - 254 (Default is 8).
  counter_count:
    name: Comfort Counters
    description: >-
      The number of Cytech Comfort Counters that are shown in Home Assistant and can range from 0 - 255 (Default is 8).
  timer_count:
    name: Comfort Timers
    description: >-
      The number of Cytech Comfort Timers that are shown in Home Assistant and can range from 0 - 64 (Default is 8).
  sensor_count:
    name: Comfort Sensors
    description: >-
      The number of Cytech Comfort Sensors that are shown in Home Assistant and can range from 0 - 32 (Default is 8).
  alarm_responses:
    name: Comfort Responses
    description: >-
      The number of Cytech Comfort Responses that can be activated. Range from 0 - 1024 (Default is 0).
  comfort_time:
    name: Set Comfort Time and Date.
    description: >-
      Set Cytech Comfort Time and Date on successful logon and once a day at midnight (Default is False).
  passthrough_enabled:
    name: Enable Comfigurator Maintenance Mode
    description: Allow direct TCP passthrough access for Comfigurator. Home Assistant communication with Comfort is suspended while enabled (Default is False).